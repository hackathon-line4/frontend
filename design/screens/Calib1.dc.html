<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 진동 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 32px">
<div style="height: 56px; display: flex; align-items: center; margin-left: -12px">
<button type="button" aria-label="뒤로 가기" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
</div>
<h1 style="margin: 4px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">내 진동 설정</h1>
<p style="margin: 6px 0 0; font-size: 17px; line-height: 1.55; color: #4A4844">나에게 잘 느껴지는 진동으로 맞춰요.</p>
<p role="status" style="margin: 14px 0 0; align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 18px; background: #FCEFC4; font-size: 15px; font-weight: 800">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
바꾼 설정 · 아직 저장 안 함
</p>

<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 12px">
<section aria-labelledby="l-int" style="border: 2px solid #252525; border-radius: 20px; background: #FFFFFF; padding: 12px 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="l-int" style="margin: 0; font-size: 18px; font-weight: 800">세기</h2>
<span style="font-size: 14px; color: #4A4844">이 기기: 3단계까지</span>
</div>
<div style="margin-top: 8px; display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center">
<button type="button" aria-label="세기 낮추기" style="height: 64px; border: 2px solid #252525; border-radius: 16px; background: #FFFDF7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<p aria-live="polite" style="margin: 0; text-align: center; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">강하게</span><span style="font-size: 14px; color: #4A4844">3단계 중 3</span></p>
<button type="button" disabled aria-label="세기 높이기, 최대" style="height: 64px; border: 2px dashed #8A867C; border-radius: 16px; background: #F2EFE6; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8A867C" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</section>
<section aria-labelledby="l-len" style="border: 2px solid #252525; border-radius: 20px; background: #FFFFFF; padding: 12px 14px">
<h2 id="l-len" style="margin: 0; font-size: 18px; font-weight: 800">길이</h2>
<div style="margin-top: 8px; display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center">
<button type="button" aria-label="길이 줄이기" style="height: 64px; border: 2px solid #252525; border-radius: 16px; background: #FFFDF7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<p aria-live="polite" style="margin: 0; text-align: center; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">보통</span><span style="font-size: 14px; color: #4A4844">3단계 중 2</span></p>
<button type="button" aria-label="길이 늘리기" style="height: 64px; border: 2px solid #252525; border-radius: 16px; background: #FFFDF7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</section>
<section aria-labelledby="l-rep" style="border: 2px solid #252525; border-radius: 20px; background: #FFFFFF; padding: 12px 14px">
<h2 id="l-rep" style="margin: 0; font-size: 18px; font-weight: 800">반복</h2>
<div style="margin-top: 8px; display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center">
<button type="button" aria-label="반복 줄이기" style="height: 64px; border: 2px solid #252525; border-radius: 16px; background: #FFFDF7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<p aria-live="polite" style="margin: 0; text-align: center; display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800">2번</span><span style="font-size: 14px; color: #4A4844">신호를 2번 들려줘요</span></p>
<button type="button" aria-label="반복 늘리기" style="height: 64px; border: 2px solid #252525; border-radius: 16px; background: #FFFDF7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</section>
</div>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 80px; border: 0; border-radius: 20px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#252525" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>
진동 테스트</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
