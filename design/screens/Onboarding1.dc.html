<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온보딩 1 · 서비스 소개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px; display: flex; justify-content: flex-end; align-items: center">
<button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #4A4844">건너뛰기</button>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 280px; height: 280px; border-radius: 50%; background: {{tint}}; display: flex; align-items: center; justify-content: center">
<svg width="220" height="220" viewBox="0 0 220 220" fill="none" role="img" aria-label="진동하며 메시지를 받는 스마트폰">
<rect x="70" y="30" width="80" height="160" rx="18" fill="#FFFDF7" stroke="#252525" stroke-width="4"></rect>
<line x1="100" y1="44" x2="120" y2="44" stroke="#252525" stroke-width="4" stroke-linecap="round"></line>
<rect x="84" y="88" width="52" height="34" rx="12" fill="{{accent}}" stroke="#252525" stroke-width="3"></rect>
<path d="M96 122 l-4 10 l12 -10" fill="{{accent}}" stroke="#252525" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="99" cy="105" r="3" fill="#252525"></circle>
<circle cx="110" cy="105" r="3" fill="#252525"></circle>
<circle cx="121" cy="105" r="3" fill="#252525"></circle>
<g stroke="#252525" stroke-width="4" stroke-linecap="round">
<path d="M56 86 q-9 24 0 48"></path>
<path d="M40 74 q-15 36 0 72"></path>
<path d="M164 86 q9 24 0 48"></path>
<path d="M180 74 q15 36 0 72"></path>
</g>
</svg>
</div>
</div>
<div style="text-align: center; padding: 0 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">진동으로 전하는 메시지</h1>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.65; color: #4A4844">보호자가 보낸 글이 스마트폰 진동으로 바뀌어 전달돼요. 소리와 화면 없이도 마음을 주고받을 수 있어요.</p>
</div>
<div role="img" aria-label="3페이지 중 1페이지" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin: 40px 0 24px">
<span style="width: 24px; height: 8px; border-radius: 4px; background: #252525"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFCBC0"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFCBC0"></span>
</div>
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">다음
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"tint":{"editor":"color","default":"#FCEFC4"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C', tint: this.props.tint ?? '#FCEFC4' };
}
}
</script>
</body>
</html>
