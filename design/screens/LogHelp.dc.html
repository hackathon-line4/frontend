<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도움 요청 기록 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px; display: flex; align-items: center; gap: 4px; margin-left: -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="font-size: 17px; font-weight: 800">신호 기록</span>
</div>
<p style="margin: 12px 0 0; align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; border: 2px solid #252525; font-size: 14px; font-weight: 800">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
당사자가 보낸 기록</p>
<h1 style="margin: 12px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">도움 요청</h1>
<p style="margin: 4px 0 0; font-size: 16px; color: #4A4844">김하늘이 화면을 3초 길게 눌러 보냈어요</p>

<section aria-labelledby="h-time" style="margin-top: 20px; border: 1.5px solid #CFCBC0; border-radius: 18px; background: #FFFFFF; padding: 16px">
<h2 id="h-time" style="margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #4A4844">기록</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px">
<li style="display: flex; justify-content: space-between"><span>당사자가 보냄</span><span style="font-weight: 800">14:05:12</span></li>
<li style="display: flex; justify-content: space-between"><span>내 휴대폰에 도착</span><span style="font-weight: 800">14:05:13</span></li>
<li style="display: flex; justify-content: space-between"><span>내가 열어 봄</span><span style="font-weight: 800">14:06:40</span></li>
</ol>
</section>

<section aria-labelledby="h-loc" style="margin-top: 12px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 id="h-loc" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
도움 요청과 함께 공유된 위치</h2>
<div role="img" aria-label="지도 영역, 공유된 위치 표시" style="height: 160px; border-radius: 14px; background: #E9E5DA; display: flex; align-items: center; justify-content: center; color: #4A4844; font-size: 14px; font-weight: 500">[지도 영역]</div>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 15px">
<dt style="color: #4A4844">주소</dt><dd style="margin: 0; font-weight: 800">[공유된 주소]</dd>
<dt style="color: #4A4844">기준 시각</dt><dd style="margin: 0; font-weight: 800">14:05:12</dd>
<dt style="color: #4A4844">정확도</dt><dd style="margin: 0; font-weight: 800">약 [N]m</dd>
</dl>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A4844">요청한 순간의 위치 한 번만 공유돼요. 그 뒤의 위치는 공유되지 않아요.</p>
<button type="button" style="height: 52px; border: 2px solid #252525; border-radius: 14px; background: transparent; font-family: inherit; font-size: 16px; font-weight: 800; color: #252525">지도 앱에서 열기</button>
</section>

<section aria-labelledby="h-after" style="margin-top: 12px; border: 1.5px solid #CFCBC0; border-radius: 18px; background: #FFFFFF; padding: 16px">
<h2 id="h-after" style="margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #4A4844">이후 주고받은 신호</h2>
<a href="#" style="min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #252525">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">나 여기 있어 · 14:07 보냄</span><span style="font-size: 14px; color: #4A4844">기기 전달 14:07 · 터치 응답 14:08</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</section>
</main>
</x-dc>

</body>
</html>
