<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온보딩 3 · 진동 체험</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px"></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
<div style="width: 280px; height: 280px; border-radius: 50%; background: {{tint}}; display: flex; align-items: center; justify-content: center">
<button type="button" aria-label="진동 체험하기. 누르면 '밥 먹었어?' 메시지를 진동으로 느낄 수 있어요" style="width: 200px; height: 200px; border-radius: 50%; border: 4px solid #252525; background: {{accent}}; color: #252525; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0">
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true">
<path d="M19 12 q9 -9 18 0" stroke="#252525" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M13 7 q15 -14 30 0" stroke="#252525" stroke-width="3.5" stroke-linecap="round"></path>
<line x1="28" y1="22" x2="28" y2="36" stroke="#252525" stroke-width="8" stroke-linecap="round"></line>
<rect x="17" y="32" width="24" height="20" rx="8" fill="#252525"></rect>
</svg>
<span style="font-size: 18px; font-weight: 800; line-height: 1.35">눌러서<br>진동 느끼기</span>
</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #252525; font-size: 14px; font-weight: 500">
<span style="font-weight: 800">밥 먹었어?</span>
<span style="display: flex; align-items: center; gap: 4px" aria-hidden="true">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #252525"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #252525"></span>
<span style="width: 24px; height: 8px; border-radius: 4px; background: #252525"></span>
</span>
<span style="color: #4A4844">짧게 · 짧게 · 길게</span>
</div>
</div>
<div style="text-align: center; padding: 0 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">직접 느껴 보세요</h1>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.65; color: #4A4844">위 버튼을 누르면 '밥 먹었어?'라는 메시지가 진동으로 전해져요.</p>
</div>
<div role="img" aria-label="3페이지 중 3페이지" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin: 40px 0 24px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFCBC0"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFCBC0"></span>
<span style="width: 24px; height: 8px; border-radius: 4px; background: #252525"></span>
</div>
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: #252525; color: #FFFDF7; font-family: inherit; font-size: 18px; font-weight: 800">시작하기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"tint":{"editor":"color","default":"#FCEFC4"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C', tint: this.props.tint ?? '#FCEFC4' };
}
}
</script>
</body>
</html>
