<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · 코드 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;family=Roboto+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 56px; display: flex; align-items: center; margin-left: -12px">
<button type="button" aria-label="뒤로 가기" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
</div>
<label for="r-code" style="margin-top: 16px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">연결 코드 입력</label>
<p style="margin: 8px 0 0; font-size: 18px; line-height: 1.6; color: #4A4844">보호자에게 받은 숫자 6자리</p>
<div style="position: relative; margin-top: 28px">
<input id="r-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="482" aria-describedby="r-code-count" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; font-family: 'Roboto Mono', monospace; font-size: 34px; font-weight: 700">
<span style="height: 72px; border: 2px solid #252525; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">4</span>
<span style="height: 72px; border: 2px solid #252525; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">8</span>
<span style="height: 72px; border: 2px solid #252525; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">2</span>
<span style="height: 72px; border: 4px solid #252525; border-radius: 14px; background: {{tint}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 3px; height: 32px; background: #252525"></span></span>
<span style="height: 72px; border: 2px solid #8A867C; border-radius: 14px; background: #FFFFFF"></span>
<span style="height: 72px; border: 2px solid #8A867C; border-radius: 14px; background: #FFFFFF"></span>
</div>
</div>
<p id="r-code-count" style="margin: 12px 0 0; font-size: 16px; font-weight: 500; color: #4A4844">6자리 중 3자리 입력</p>
<div style="display: flex; align-items: center; gap: 12px; margin: 32px 0 20px; font-size: 16px; color: #4A4844">
<span style="flex: 1; height: 1.5px; background: #CFCBC0"></span>또는<span style="flex: 1; height: 1.5px; background: #CFCBC0"></span>
</div>
<button type="button" style="width: 100%; height: 80px; border: 2px solid #252525; border-radius: 20px; background: #FFFFFF; color: #252525; font-family: inherit; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path><rect x="7" y="7" width="4" height="4"></rect><rect x="13" y="7" width="4" height="4"></rect><rect x="7" y="13" width="4" height="4"></rect><path d="M14 14h3v3"></path></svg>
QR 코드로 연결</button>
<div style="flex: 1"></div>
<button type="button" disabled aria-describedby="r-code-count" style="width: 100%; height: 72px; border: 2px dashed #8A867C; border-radius: 20px; background: #F2EFE6; color: #5C5A54; font-family: inherit; font-size: 20px; font-weight: 800">연결 요청하기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#FCEFC4"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { tint: this.props.tint ?? '#FCEFC4' };
}
}
</script>
</body>
</html>
