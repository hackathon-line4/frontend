<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 기록 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px; display: flex; align-items: center; gap: 4px; margin-left: -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="font-size: 17px; font-weight: 800">신호 기록</span>
</div>
<h1 style="margin: 12px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">나 여기 있어</h1>
<p style="margin: 4px 0 0; font-size: 16px; color: #4A4844">보호자가 가까이 있다고 알려요</p>
<p style="margin: 6px 0 0; font-size: 14px; color: #4A4844">10월 26일 (월) · 김하늘에게</p>

<section aria-labelledby="d-del" style="margin-top: 22px; border: 1.5px solid #CFCBC0; border-radius: 18px; background: #FFFFFF; padding: 16px">
<h2 id="d-del" style="margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #4A4844">기기 전달</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px">
<li style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>보냄</span><span style="font-weight: 800">17:55:02</span></li>
<li style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>기기에 전달 완료</span><span style="font-weight: 800">17:55:04</span></li>
<li style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>진동 재생 (기기 보고)</span><span style="font-weight: 800">17:55:04</span></li>
</ol>
</section>

<section aria-labelledby="d-res" style="margin-top: 12px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; padding: 16px">
<h2 id="d-res" style="margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #4A4844">터치 응답</h2>
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="{{accent}}" stroke="#252525" stroke-width="1.5"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
응답 완료</p>
<dl style="margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 15px">
<dt style="color: #4A4844">응답 시각</dt><dd style="margin: 0; font-weight: 800">17:58:10</dd>
<dt style="color: #4A4844">걸린 시간</dt><dd style="margin: 0; font-weight: 800">전달 후 3분 6초</dd>
</dl>
</section>

<section aria-labelledby="d-rel" style="margin-top: 12px; border: 1.5px solid #CFCBC0; border-radius: 18px; background: #FFFFFF; padding: 16px">
<h2 id="d-rel" style="margin: 0 0 6px; font-size: 14px; font-weight: 800; color: #4A4844">관련 도움 요청 · 위치 공유</h2>
<p style="margin: 0; font-size: 15px; color: #4A4844">이 신호와 관련된 기록이 없어요.</p>
</section>

<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: #4A4844">터치 응답은 당사자가 화면을 터치한 기록이에요. 신호의 뜻을 알아들었다는 뜻은 아니에요.</p>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 56px; border: 2px solid #252525; border-radius: 16px; background: transparent; color: #252525; font-family: inherit; font-size: 17px; font-weight: 800">이 신호 다시 보내기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
