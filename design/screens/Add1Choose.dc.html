<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 추가 1 · 종류 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 36px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 16px; font-weight: 800">신호 추가</span>
<button type="button" aria-label="닫기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="4단계 중 1단계" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px"><span style="height: 6px; border-radius: 3px; background: #252525"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span></div>
<p style="margin: 14px 0 0; font-size: 13px; font-weight: 800; color: #4A4844">1단계 · 어떤 신호인가</p>
<h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.35">어떤 신호를<br>추가할까요?</h1>

<div role="radiogroup" aria-label="신호 추가 방법" style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px">
<button type="button" role="radio" aria-checked="true" style="min-height: 132px; padding: 18px; border: 2.5px solid #252525; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); font-family: inherit; color: #252525; text-align: left; display: flex; gap: 14px; align-items: flex-start">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FCEFC4; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM4 17a2 2 0 0 1 2-2h12"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 800">촉신호 목록에서 고르기</span>
<span style="font-size: 14px; line-height: 1.55; color: #4A4844">현장에서 쓰는 촉신호 어휘에서 골라요. 리듬이 미리 정해져 있어요.</span>
<span style="align-self: flex-start; display: flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; border: 1.5px solid #252525; font-size: 11px; font-weight: 800">기본 신호</span>
</span>
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#252525"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFDF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button type="button" role="radio" aria-checked="false" style="min-height: 132px; padding: 18px; border: 1.5px solid #CFCBC0; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); font-family: inherit; color: #252525; text-align: left; display: flex; gap: 14px; align-items: flex-start">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #F2EFE6; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 800">직접 만들기</span>
<span style="font-size: 14px; line-height: 1.55; color: #4A4844">우리 가족만 쓰는 신호를 이름과 리듬부터 새로 만들어요.</span>
<span style="align-self: flex-start; display: flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: #252525; color: #FFFDF7; font-size: 11px; font-weight: 800">직접 만든 신호</span>
</span>
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#8A867C" stroke-width="1.8"></circle></svg>
</button>
</div>
<div style="flex: 1"></div>
<button type="button" style="height: 58px; border: 0; border-radius: 16px; background: {{accent}}; font-family: inherit; font-size: 18px; font-weight: 800; color: #252525">다음</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
