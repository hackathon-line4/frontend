<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · 응답 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFFDF7}a:hover{color:#FFF}
</style>
</helmet>
<main role="status" aria-label="응답했어요. 잠시 뒤 대기 화면으로 돌아가요" style="width: 390px; height: 844px; background: #000000; display: flex; align-items: center; justify-content: center">
<svg width="320" height="320" viewBox="0 0 320 320" aria-hidden="true">
<path d="M48 168 l76 76 l148 -164" fill="none" stroke="{{accent}}" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
