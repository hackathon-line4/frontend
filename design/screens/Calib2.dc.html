<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>진동 테스트 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: {{accent}}; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; align-items: center; padding: 52px 24px 40px">
<div role="status" aria-live="assertive" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
<span style="width: 160px; height: 160px; border-radius: 50%; background: #FFFDF7; border: 3px solid #252525; display: flex; align-items: center; justify-content: center">
<svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M11 17.5h2"></path></svg>
</span>
<h1 style="margin: 32px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em">진동 테스트 중</h1>
<p style="margin: 10px 0 0; font-size: 20px; font-weight: 500; line-height: 1.5">휴대폰을 손에 쥐고<br>느껴 보세요</p>
<p style="margin: 28px 0 0; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px; background: #FFFDF7; border: 2px solid #252525; font-size: 18px; font-weight: 800">2번 중 1번째</p>
<p style="margin: 14px 0 0; font-size: 16px; font-weight: 500">세기 강하게 · 길이 보통 · 반복 2번</p>
</div>
<button type="button" style="width: 100%; height: 80px; border: 2px solid #252525; border-radius: 20px; background: #FFFDF7; color: #252525; font-family: inherit; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="#252525" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
테스트 멈추기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
