<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 추가 2 · 직접 조합하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
.gs{display:inline-block;width:18px;height:18px;border-radius:9px;background:currentColor}
.gm{display:inline-block;width:32px;height:18px;border-radius:9px;background:currentColor}
.gl{display:inline-block;width:56px;height:18px;border-radius:9px;background:currentColor}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 36px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 16px; font-weight: 800">신호 추가</span>
<button type="button" aria-label="닫기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-label="4단계 중 2단계" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px"><span style="height: 6px; border-radius: 3px; background: #252525"></span><span style="height: 6px; border-radius: 3px; background: #252525"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span></div>
<p style="margin: 14px 0 0; font-size: 13px; font-weight: 800; color: #4A4844">2단계 · 진동 리듬 만들기</p>
<div role="tablist" aria-label="리듬 만드는 방법" style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 14px; background: #F2EFE6">
<button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #4A4844">프리셋에서 고르기</button>
<button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(37,37,37,.12); font-family: inherit; font-size: 15px; font-weight: 800; color: #252525">직접 조합하기</button>
</div>

<section aria-labelledby="made" style="margin-top: 14px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="made" style="margin: 0; font-size: 15px; font-weight: 800">만든 리듬</h2>
<span style="font-size: 13px; color: #4A4844">3 / 최대 5박자 · 약 2.2초</span>
</div>
<ol aria-label="길게, 짧게, 중간" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px">
<li style="height: 72px; border-radius: 14px; background: #F6F3EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span class="gl" style="width: 44px" aria-hidden="true"></span><span style="font-size: 12px; font-weight: 800">길게</span></li>
<li style="height: 72px; border-radius: 14px; background: #F6F3EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span class="gs" aria-hidden="true"></span><span style="font-size: 12px; font-weight: 800">짧게</span></li>
<li style="height: 72px; border-radius: 14px; background: #F6F3EA; border: 2px solid #252525; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span class="gm" aria-hidden="true"></span><span style="font-size: 12px; font-weight: 800">중간</span></li>
<li aria-label="빈 칸" style="height: 72px; border-radius: 14px; border: 1.5px dashed #B5B1A6; box-sizing: border-box"></li>
<li aria-label="빈 칸" style="height: 72px; border-radius: 14px; border: 1.5px dashed #B5B1A6; box-sizing: border-box"></li>
</ol>
<div style="display: flex; align-items: center; gap: 8px">
<p role="status" style="flex: 1; margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#1E6B3F"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>같은 리듬을 쓰는 신호가 없어요</p>
<button type="button" style="height: 40px; padding: 0 12px; border: 1.5px solid #252525; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 800; color: #252525; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#252525" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>들어보기</button>
</div>
</section>

<section aria-labelledby="add" style="margin-top: 18px">
<h2 id="add" style="margin: 0 0 10px; font-size: 15px; font-weight: 800">박자 추가</h2>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
<button type="button" aria-label="짧게 추가, 0.2초" style="height: 104px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); font-family: inherit; color: #252525; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><span class="gs" aria-hidden="true"></span><span style="font-size: 17px; font-weight: 800">짧게</span><span style="font-size: 12px; color: #4A4844">0.2초</span></button>
<button type="button" aria-label="중간 추가, 0.5초" style="height: 104px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); font-family: inherit; color: #252525; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><span class="gm" aria-hidden="true"></span><span style="font-size: 17px; font-weight: 800">중간</span><span style="font-size: 12px; color: #4A4844">0.5초</span></button>
<button type="button" aria-label="길게 추가, 0.9초" style="height: 104px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); font-family: inherit; color: #252525; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><span class="gl" aria-hidden="true"></span><span style="font-size: 17px; font-weight: 800">길게</span><span style="font-size: 12px; color: #4A4844">0.9초</span></button>
</div>
<div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<button type="button" style="height: 48px; border: 1.5px solid #8A867C; border-radius: 14px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 800; color: #252525; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM12 9l6 6M18 9l-6 6"></path></svg>하나 지우기</button>
<button type="button" style="height: 48px; border: 1.5px solid #8A867C; border-radius: 14px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 800; color: #252525; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>모두 지우기</button>
</div>
</section>
<div style="flex: 1"></div>
<button type="button" style="height: 58px; border: 0; border-radius: 16px; background: {{accent}}; font-family: inherit; font-size: 18px; font-weight: 800; color: #252525">다음 · 느껴 보기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
