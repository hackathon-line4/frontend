<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보호자 · 연결 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; align-items: center; padding: 140px 24px 40px">
<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="연결 완료">
<circle cx="60" cy="60" r="58" fill="#FCEFC4"></circle>
<circle cx="60" cy="60" r="42" fill="{{accent}}" stroke="#252525" stroke-width="4"></circle>
<path d="M42 61 l12 12 l24 -26" fill="none" stroke="#252525" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<h1 style="margin: 28px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">연결됐어요</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #4A4844; text-align: center">이제 김하늘님과 메시지를 주고받을 수 있어요.</p>
<section aria-label="연결된 계정" style="margin-top: 32px; width: 100%; box-sizing: border-box; border: 2px solid #252525; border-radius: 20px; background: #FFFFFF; padding: 16px 20px; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; border: 2px solid #252525; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">하</span>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 18px; font-weight: 800">김하늘</span>
<span style="font-size: 14px; color: #4A4844">당사자</span>
</div>
<span style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: #252525; color: #FFFDF7; font-size: 14px; font-weight: 800">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"></path></svg>
연결됨</span>
</section>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800">첫 메시지 보내기</button>
<button type="button" style="margin-top: 8px; min-height: 48px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 16px; font-weight: 800; color: #4A4844">홈으로</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
