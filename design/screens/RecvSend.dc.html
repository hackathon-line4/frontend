<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · 신호 보내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFDF7}a:hover{color:#FFF}
</style>
</helmet>
<main style="width: 390px; height: 844px; background: #000000; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex">
<button type="button" aria-label="보호자 부르기 보내기. 화면 어디든 누르면 이영희 보호자에게 보내요" style="flex: 1; border: 0; margin: 0; padding: 0; background: #000000; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
<span style="width: 300px; height: 300px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="170" height="170" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin: 0 10px 0 0">
<path d="M21.5 2.5L2.5 10.2l7.3 3.1 3.1 7.7z" fill="#000000" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"></path>
<path d="M21.5 2.5L9.8 13.3" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"></path>
</svg>
</span>
<span style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; color: {{accent}}">보호자 부르기</span>
</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
