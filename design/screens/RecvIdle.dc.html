<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · 대기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFFDF7}a:hover{color:#FFF}
</style>
</helmet>
<main style="width: 390px; height: 844px; background: #000000; display: flex">
<button type="button" aria-label="손울림 대기 중. 이영희 보호자와 연결됨. 두 번 탭하면 신호 보내기, 3초 길게 누르면 도움 요청" style="flex: 1; border: 0; margin: 0; padding: 0; background: #000000; display: flex; align-items: center; justify-content: center">
<svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
<circle cx="140" cy="140" r="122" fill="none" stroke="{{accent}}" stroke-width="32"></circle>
</svg>
</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
