<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 상세 · 알려주기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
.rh{display:inline-flex;align-items:center;gap:10px}
.rd{display:inline-block;width:20px;height:20px;border-radius:10px;background:currentColor}
.rl{display:inline-block;width:58px;height:20px;border-radius:10px;background:currentColor}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 36px">
<div style="height: 48px; display: flex; align-items: center; margin-left: -10px">
<button type="button" style="height: 48px; padding: 0 10px 0 0; border: 0; background: transparent; font-family: inherit; font-size: 16px; font-weight: 500; color: #252525; display: flex; align-items: center; gap: 2px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>뒤로</button>
</div>

<div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="width: 84px; height: 84px; border-radius: 24px; background: #FCEFC4; display: flex; align-items: center; justify-content: center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0zM9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"></path></svg></span>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">밥 먹자</h1>
<span style="display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; background: #252525; color: #FFFDF7; font-size: 13px; font-weight: 800"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>직접 만든 신호</span>
</div>

<section aria-labelledby="rhy" style="margin-top: 28px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<h2 id="rhy" style="margin: 0; align-self: flex-start; font-size: 15px; font-weight: 800; color: #4A4844">진동 리듬</h2>
<span class="rh" role="img" aria-label="짧게 짧게 짧게"><span class="rd"></span><span class="rd"></span><span class="rd"></span></span>
<span style="font-size: 15px; color: #4A4844">약 1.2초</span>
</section>

<div style="flex: 1"></div>
<button type="button" aria-describedby="teach-help" style="height: 64px; border: 0; border-radius: 18px; background: {{accent}}; font-family: inherit; font-size: 19px; font-weight: 800; color: #252525; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2"></rect><path d="M4 9v6M20 9v6"></path></svg>
알려주기</button>
<p id="teach-help" style="margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #4A4844; text-align: center">김하늘의 휴대폰에 이 진동이 울려요.<br>옆에서 뜻을 알려 주세요.</p>
<button type="button" style="margin-top: 16px; height: 60px; border: 2px solid #252525; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; color: #252525; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5L2.5 10.2l7.3 3.1 3.1 7.7z"></path><path d="M21.5 2.5L9.8 13.3"></path></svg>
신호 보내기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
