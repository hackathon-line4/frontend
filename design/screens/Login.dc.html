<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
input::placeholder{color:#7A766C}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 88px 24px 40px">
<div style="display: flex; align-items: flex-start; gap: 2px">
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">손울림</span>
<svg width="14" height="20" viewBox="0 0 22 30" fill="none" aria-hidden="true">
<path d="M4 9 q4 6 0 12" stroke="{{accent}}" stroke-width="4" stroke-linecap="round"></path>
<path d="M12 4 q8 11 0 22" stroke="{{accent}}" stroke-width="4" stroke-linecap="round"></path>
</svg>
</div>
<h1 style="margin: 40px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">다시 만나서 반가워요</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #4A4844">이메일로 로그인해 주세요.</p>
<form style="display: flex; flex-direction: column; gap: 20px; margin-top: 36px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-email" style="font-size: 15px; font-weight: 800">이메일</label>
<input id="login-email" type="email" autocomplete="email" placeholder="example@email.com" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-pw" style="font-size: 15px; font-weight: 800">비밀번호</label>
<div style="position: relative">
<input id="login-pw" type="password" autocomplete="current-password" placeholder="비밀번호 입력" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 56px 0 16px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
<button type="button" aria-label="비밀번호 보기" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A4844" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>
<div style="display: flex; justify-content: flex-end; margin-top: -8px">
<a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #4A4844">비밀번호를 잊으셨나요?</a>
</div>
<button type="submit" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800">로그인</button>
</form>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<p style="margin: 0; font-size: 15px; color: #4A4844">아직 계정이 없나요?</p>
<button type="button" style="width: 100%; height: 60px; border: 2px solid #252525; border-radius: 16px; background: transparent; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800">회원가입</button>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
