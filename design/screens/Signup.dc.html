<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
input::placeholder{color:#7A766C}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px; display: flex; align-items: center; margin-left: -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
</div>
<h1 style="margin: 16px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">회원가입</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #4A4844">보호자와 당사자 모두 같은 방법으로 가입해요.</p>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-email" style="font-size: 15px; font-weight: 800">이메일</label>
<input id="su-email" type="email" autocomplete="email" placeholder="example@email.com" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-pw" style="font-size: 15px; font-weight: 800">비밀번호</label>
<input id="su-pw" type="password" autocomplete="new-password" aria-describedby="su-pw-help" value="sonullim2026" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
<p id="su-pw-help" style="margin: 0; font-size: 14px; color: #4A4844">8자 이상, 영문과 숫자를 함께 써 주세요.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-pw2" style="font-size: 15px; font-weight: 800">비밀번호 확인</label>
<input id="su-pw2" type="password" autocomplete="new-password" aria-describedby="su-pw2-status" value="sonullim2026" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #252525; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
<p id="su-pw2-status" role="status" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #252525">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="{{accent}}" stroke="#252525" stroke-width="1.5"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
비밀번호가 일치해요
</p>
</div>
<label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: #FCEFC4; font-size: 15px; font-weight: 500; cursor: pointer">
<input type="checkbox" style="width: 24px; height: 24px; margin: 0; accent-color: #252525; flex-shrink: 0">
<span><b style="font-weight: 800">[필수]</b> 이용약관 및 개인정보 처리방침에 동의해요</span>
</label>
</form>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800">가입하기</button>
<p style="margin: 8px 0 0; display: flex; justify-content: center; align-items: center; gap: 4px; font-size: 15px; color: #4A4844">이미 계정이 있나요?
<a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-weight: 800">로그인</a>
</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
