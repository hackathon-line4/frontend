<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · QR 인식</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFDF7}a:hover{color:#FFF}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #252525; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #FFFDF7; display: flex; flex-direction: column; align-items: center; padding: 52px 24px 40px">
<div style="width: 100%; height: 56px; display: flex; align-items: center; margin-left: -12px">
<button type="button" aria-label="닫기" style="width: 56px; height: 56px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<h1 style="margin: 16px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; text-align: center; line-height: 1.35">보호자 화면의 QR을<br>비춰 주세요</h1>
<div aria-label="카메라 화면" role="img" style="margin-top: 36px; width: 260px; height: 260px; position: relative; border-radius: 24px; background: #3A3936">
<svg width="260" height="260" viewBox="0 0 260 260" fill="none" aria-hidden="true" style="position: absolute; inset: 0">
<g stroke="{{accent}}" stroke-width="8" stroke-linecap="round">
<path d="M8 56 V24 a16 16 0 0 1 16 -16 H56"></path>
<path d="M204 8 H236 a16 16 0 0 1 16 16 V56"></path>
<path d="M252 204 V236 a16 16 0 0 1 -16 16 H204"></path>
<path d="M56 252 H24 a16 16 0 0 1 -16 -16 V204"></path>
</g>
<rect x="85" y="85" width="90" height="90" rx="6" stroke="#8A867C" stroke-width="2" stroke-dasharray="6 6"></rect>
</svg>
</div>
<p role="status" style="margin: 28px 0 0; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border-radius: 24px; background: #3A3936; font-size: 17px; font-weight: 500">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2"></rect><path d="M4 9v6M20 9v6M1.5 11v2M22.5 11v2"></path></svg>
가까워질수록 진동이 빨라져요
</p>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 72px; border: 0; border-radius: 20px; background: #FFFDF7; color: #252525; font-family: inherit; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="3"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
코드 직접 입력</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
