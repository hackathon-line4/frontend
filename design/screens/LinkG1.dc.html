<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보호자 · 연결 시작</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 24px 40px">
<div style="height: 48px; display: flex; align-items: center; gap: 4px; margin-left: -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="font-size: 17px; font-weight: 800">계정 연결</span>
</div>
<div style="display: flex; justify-content: center; margin-top: 24px">
<div style="width: 200px; height: 200px; border-radius: 50%; background: #FCEFC4; display: flex; align-items: center; justify-content: center">
<svg width="160" height="110" viewBox="0 0 230 150" fill="none" aria-hidden="true">
<rect x="14" y="14" width="64" height="122" rx="14" fill="#FFFDF7" stroke="#252525" stroke-width="5"></rect>
<rect x="152" y="14" width="64" height="122" rx="14" fill="#FFFDF7" stroke="#252525" stroke-width="5"></rect>
<rect x="28" y="54" width="36" height="22" rx="6" fill="{{accent}}" stroke="#252525" stroke-width="3"></rect>
<path d="M164 75 q7 -14 14 0 t14 0 t14 0" stroke="#252525" stroke-width="5" stroke-linecap="round"></path>
<path d="M98 75 h34" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"></path>
<circle cx="115" cy="75" r="14" fill="{{accent}}" stroke="#252525" stroke-width="4"></circle>
<path d="M109 75 h12 M115 69 v12" stroke="#252525" stroke-width="4" stroke-linecap="round"></path>
</svg>
</div>
</div>
<h1 style="margin: 32px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3">당사자와 연결해요</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #4A4844">연결하면 서로 메시지를 주고받을 수 있어요.</p>
<ol style="list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<li style="display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #252525; color: #FFFDF7; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
연결 코드를 만들어요
</li>
<li style="display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #252525; color: #FFFDF7; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
당사자 휴대폰에 코드를 입력하거나 QR을 비춰요
</li>
<li style="display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #252525; color: #FFFDF7; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>

</li>
</ol>
<div style="flex: 1"></div>
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 16px; background: {{accent}}; color: #252525; font-family: inherit; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
연결 코드 만들기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>

</script>
</body>
</html>
