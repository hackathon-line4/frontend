<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 추가 1 · 직접 만들기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
input::placeholder{color:#7A766C}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 36px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 16px; font-weight: 800">신호 추가</span>
<button type="button" aria-label="닫기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="4단계 중 1단계" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px"><span style="height: 6px; border-radius: 3px; background: #252525"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span></div>
<div style="margin-top: 14px; display: flex; align-items: center; gap: 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em">직접 만들기</h1><span style="display: flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: #252525; color: #FFFDF7; font-size: 11px; font-weight: 800">직접 만든 신호</span></div>

<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px">
<label for="sig-name" style="font-size: 15px; font-weight: 800">신호 이름</label>
<input id="sig-name" type="text" maxlength="12" value="약 먹을 시간" aria-describedby="sig-name-count" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #252525; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #252525">
<span id="sig-name-count" style="align-self: flex-end; font-size: 13px; color: #4A4844">6 / 12자</span>
</div>

<fieldset style="margin: 16px 0 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 800">카테고리</legend>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
<label style="height: 48px; border-radius: 14px; background: #252525; color: #FFFDF7; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 800; cursor: pointer"><input type="radio" name="cat" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>일상</label>
<label style="height: 48px; border-radius: 14px; border: 1.5px solid #8A867C; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; cursor: pointer"><input type="radio" name="cat" style="position: absolute; opacity: 0; width: 1px; height: 1px">외출</label>
<label style="height: 48px; border-radius: 14px; border: 1.5px solid #8A867C; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; cursor: pointer"><input type="radio" name="cat" style="position: absolute; opacity: 0; width: 1px; height: 1px">확인</label>
<label style="height: 48px; border-radius: 14px; border: 1.5px solid #8A867C; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; cursor: pointer"><input type="radio" name="cat" style="position: absolute; opacity: 0; width: 1px; height: 1px">긴급</label>
</div>
</fieldset>

<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px">
<label for="sig-mean" style="font-size: 15px; font-weight: 800">뜻 설명 <span style="font-weight: 500; color: #4A4844">(선택)</span></label>
<input id="sig-mean" type="text" value="아침·저녁 약 먹을 시간이라고 알려요" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #252525">
<span style="font-size: 13px; color: #4A4844">보호자 화면과 기록에만 보여요.</span>
</div>
<div style="flex: 1"></div>
<button type="button" style="height: 58px; border: 0; border-radius: 16px; background: {{accent}}; font-family: inherit; font-size: 18px; font-weight: 800; color: #252525">다음 · 리듬 만들기</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
