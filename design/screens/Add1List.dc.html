<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신호 추가 1 · 촉신호 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
input::placeholder{color:#7A766C}
.rh{display:inline-flex;align-items:center;gap:5px}
.rd{display:inline-block;width:9px;height:9px;border-radius:5px;background:currentColor}
.rl{display:inline-block;width:26px;height:9px;border-radius:5px;background:currentColor}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFDF7; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; padding: 52px 20px 36px">
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
<button type="button" aria-label="뒤로 가기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 16px; font-weight: 800">신호 추가</span>
<button type="button" aria-label="닫기" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#252525" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" aria-label="4단계 중 1단계" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px"><span style="height: 6px; border-radius: 3px; background: #252525"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span><span style="height: 6px; border-radius: 3px; background: #E4E0D4"></span></div>
<h1 style="margin: 14px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.03em">촉신호 목록에서 고르기</h1>
<div style="position: relative; margin-top: 14px">
<label for="sig-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">신호 검색</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4844" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 16px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="sig-search" type="search" placeholder="신호 이름으로 찾기" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 44px; border: 1.5px solid #8A867C; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #252525">
</div>
<div role="tablist" aria-label="카테고리" style="margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: #F2EFE6">
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #4A4844">일상</button>
<button type="button" role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(37,37,37,.12); font-family: inherit; font-size: 15px; font-weight: 800; color: #252525">외출</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #4A4844">확인</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 500; color: #4A4844">긴급</button>
</div>

<div role="radiogroup" aria-label="외출 신호" style="margin-top: 12px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 2px rgba(37,37,37,.06), 0 6px 16px rgba(37,37,37,.06); padding: 0 14px">
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 72px; border: 0; background: transparent; font-family: inherit; color: #252525; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 800">버스 타자</span><span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A4844"><span class="rh" style="color: #252525" role="img" aria-label="짧게 짧게 길게 길게"><span class="rd"></span><span class="rd"></span><span class="rl"></span><span class="rl"></span></span>버스에 함께 타자는 뜻</span></span>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#252525"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFDF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 72px; border: 0; border-top: 1px solid #EEEAE0; background: transparent; font-family: inherit; color: #252525; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 800">계단 있어</span><span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A4844"><span class="rh" style="color: #252525" role="img" aria-label="길게 짧게 길게"><span class="rl"></span><span class="rd"></span><span class="rl"></span></span>앞에 계단이 있다는 뜻</span></span>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#8A867C" stroke-width="1.8"></circle></svg>
</button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 72px; border: 0; border-top: 1px solid #EEEAE0; background: transparent; font-family: inherit; color: #252525; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 800">앉아</span><span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A4844"><span class="rh" style="color: #252525" role="img" aria-label="길게 짧게 짧게 짧게"><span class="rl"></span><span class="rd"></span><span class="rd"></span><span class="rd"></span></span>자리에 앉자는 뜻</span></span>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#8A867C" stroke-width="1.8"></circle></svg>
</button>
<button type="button" role="radio" aria-checked="false" aria-disabled="true" style="width: 100%; min-height: 72px; border: 0; border-top: 1px solid #EEEAE0; background: transparent; font-family: inherit; color: #5C5A54; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 800">가자</span><span style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="rh" role="img" aria-label="짧게 길게 짧게"><span class="rd"></span><span class="rl"></span><span class="rd"></span></span>함께 이동하자는 뜻</span></span>
<span style="height: 26px; padding: 0 8px; border-radius: 13px; border: 1.5px dashed #5C5A54; display: flex; align-items: center; font-size: 12px; font-weight: 800">이미 추가됨</span>
</button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 72px; border: 0; border-top: 1px solid #EEEAE0; background: transparent; font-family: inherit; color: #252525; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 5px"><span style="font-size: 16px; font-weight: 800">길 건너자</span><span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A4844"><span class="rh" style="color: #252525" role="img" aria-label="짧게 길게 길게"><span class="rd"></span><span class="rl"></span><span class="rl"></span></span>횡단보도를 건너자는 뜻</span></span>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="#8A867C" stroke-width="1.8"></circle></svg>
</button>
</div>
<div style="flex: 1"></div>
<button type="button" style="height: 58px; border: 0; border-radius: 16px; background: {{accent}}; font-family: inherit; font-size: 18px; font-weight: 800; color: #252525">'버스 타자'로 계속</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
