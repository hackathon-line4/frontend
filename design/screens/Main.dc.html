<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>손울림 스플래시</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252525}a:hover{color:#000}
</style>
</helmet>
<main aria-label="손울림, 소리 없이 마음을 전하다" style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #252525; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 24px">
<div style="display: flex; align-items: flex-start; gap: 4px">
<h1 style="margin: 0; font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">손울림</h1>
<svg width="22" height="30" viewBox="0 0 22 30" fill="none" aria-hidden="true" style="margin-top: -2px">
<path d="M4 9 q4 6 0 12" stroke="{{accent}}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M12 4 q8 11 0 22" stroke="{{accent}}" stroke-width="3.5" stroke-linecap="round"></path>
</svg>
</div>
<p style="margin: 12px 0 0 0; font-size: 13px; font-weight: 500; letter-spacing: -0.01em; color: #252525">소리 없이, 마음을 전하다</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"bg":{"editor":"color","default":"#FFFDF7"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#F5C84C',
bg: this.props.bg ?? '#FFFDF7'
};
}
}
</script>
</body>
</html>
