<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>당사자 · 신호 수신</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<main style="width: 390px; height: 844px; background: {{accent}}; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex">
<button type="button" aria-label="이영희, 누가 왔어. 화면 어디든 누르면 응답해요" style="flex: 1; border: 0; margin: 0; padding: 0; background: {{accent}}; font-family: inherit; display: flex; align-items: center; justify-content: center">
<span style="width: 320px; height: 320px; border-radius: 50%; background: #000000; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 800; letter-spacing: -0.04em; text-align: center; line-height: 1.15">누가<br>왔어</span>
</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C84C"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F5C84C' };
}
}
</script>
</body>
</html>
