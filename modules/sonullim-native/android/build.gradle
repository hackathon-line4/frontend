plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sonullim'
version = '0.1.0'

android {
  namespace "com.sonullim.nativemodule"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // NotificationCompat · ContextCompat (포그라운드 서비스 알림)
  implementation 'androidx.core:core-ktx:1.13.1'
}
