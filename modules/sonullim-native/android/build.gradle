plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sonullim'
version = '0.1.0'

android {
  namespace "com.sonullim.nativemodule"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // NotificationCompat · ContextCompat (포그라운드 서비스 알림)
  implementation 'androidx.core:core-ktx:1.13.1'
  // B-8 FCM 푸시 받기. google-services.json이 없으면 초기화되지 않고 조용히 꺼져 있는다
  implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
